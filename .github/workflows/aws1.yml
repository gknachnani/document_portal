name: Deploy to Amazon ECS V1

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: documentportal
  ECS_SERVICE: document-portal-service
  STACK_NAME: ecr-repo-stack

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (assume role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::719742385994:role/GitHubActionsDeployer
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Show template1.yml
        run: |
          echo "PATH: infrastructure/template1.yml"
          ls -la infrastructure/
          echo "----- BEGIN -----"
          sed -n '1,200p' infrastructure/template1.yml
          echo "------ END ------"


      - name: Deploy CloudFormation stack (uses built image)
        run: |
          set -e
          aws cloudformation deploy \
            --template-file infrastructure/template1.yml \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides ImageUrl=${{ steps.build-image.outputs.image }} \
            --no-fail-on-empty-changeset || (
              aws cloudformation describe-stack-events --stack-name ${{ env.STACK_NAME }} --max-items 25
              exit 1
            )


      - name: Wait for ECS service to stabilize
        run: |
          CLUSTER=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='ECSClusterName'].OutputValue" \
            --output text)
          echo "Using cluster: $CLUSTER"
          aws ecs wait services-stable --cluster "$CLUSTER" --services ${{ env.ECS_SERVICE }}
          aws ecs describe-services --cluster "$CLUSTER" --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].events[0:5]'


      - name: Deployment success message
        run: echo "Deployment successful. App is live on ECS Fargate."
